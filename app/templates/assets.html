{% extends "base.html" %}
{% block title %}Assets | {{ settings.app_name }}{% endblock %}
{% block content %}
<h1 class="mb-4">Asset Explorer</h1>
<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Asset Name</th><th>Asset UUID</th><th>Site UUID</th><th>Asset Type</th></tr></thead><tbody>
{% for asset in assets %}<tr><td class="fw-semibold">{{ asset.name }}</td><td><code>{{ asset.uuid }}</code></td><td><code>{{ asset.site_uuid }}</code></td><td>{{ asset.asset_type }}</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
